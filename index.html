<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Longview China Travel — tailor-made inbound leisure travel and business travel to China. Flights, hotels, cars, guides, translation and more."
    />
    <meta name="theme-color" content="#000000" />
    <!-- 本地开发时的基础防护；部署后由 _headers / vercel.json 提供完整安全响应头 -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!-- 社交分享卡片（Facebook / WhatsApp / 微信等抓取） -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Longview China Travel — Tailor-made trips to China" />
    <meta
      property="og:description"
      content="Inbound leisure travel & business travel, fully tailored——premium travel experiences at approachable prices."
    />
    <meta property="og:image" content="media/img0.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- 搜索引擎结构化数据：帮助 Google 识别我们是旅行社 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "name": "Longview China Travel",
        "description": "Tailor-made inbound leisure travel and business travel to China for overseas visitors.",
        "email": "longviewchinatravel@gmail.com",
        "telephone": "+44 7511987919",
        "sameAs": [
          "https://www.facebook.com/profile.php?id=61590580290168",
          "https://www.tiktok.com/@longviewchinatravel",
          "https://www.instagram.com/longviewchinatravel/"
        ],
        "areaServed": "CN",
        "availableLanguage": ["English", "Chinese", "Italian", "Spanish"]
      }
    </script>
    <title>Longview China Travel — Tailor-made trips to China</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
